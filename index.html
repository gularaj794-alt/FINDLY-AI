<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FINDLY AI</title>
<style>
:root{--n:#142D4E;--b:#3478F6;--bg:#F5F7FB;--c:#fff;--g:#20B486;--t:#1b2433;--m:#6b7788;--bd:#e3e8f0;--hero:#142D4E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--c:#17233a;--t:#e8eef9;--m:#9aa7bd;--bd:#27364f;--n:#8fb4ff;--hero:#17305a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--c:#17233a;--t:#e8eef9;--m:#9aa7bd;--bd:#27364f;--n:#8fb4ff;--hero:#17305a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Manrope,Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;color:var(--n);font-size:20px;margin-right:12px;text-decoration:none}.logo b{color:var(--b)}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}nav a{padding:7px 11px;border-radius:9px;color:var(--m);text-decoration:none;font-weight:600;transition:.2s;font-size:14px}
nav a:hover,nav a.on{background:var(--bg);color:var(--b)}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.hero{background:linear-gradient(135deg,var(--hero),#2457a8);color:#fff;border-radius:22px;padding:44px 28px;margin-bottom:22px}
.hero h1{margin:0 0 10px;font-size:clamp(26px,5vw,42px)}.hero p{max-width:640px;opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border:0;background:var(--b);color:#fff;padding:9px 16px;border-radius:11px;font:600 14px inherit;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px #3478f64d}.btn.g{background:var(--g)}.btn.o{background:var(--bg);color:var(--t);border:1px solid var(--bd)}.btn.r{background:#e5484d}.btn.big{padding:13px 22px;font-size:16px}.btn.s{padding:5px 10px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:16px;transition:.2s}
.item{padding:0;overflow:hidden;cursor:pointer}.item:hover{transform:translateY(-4px);box-shadow:0 10px 26px #142d4e1f}
.item .im{height:150px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:42px}.item .im img{width:100%;height:100%;object-fit:cover}.item .bd{padding:14px}
.num{display:block;font-size:32px;color:var(--n)}small,.mut{color:var(--m)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;margin:0 4px 4px 0}
.g{--k:#20B486}.b{--k:#3478F6}.p{--k:#8a5cf5}.x{--k:#8793a5}.badge{background:color-mix(in srgb,var(--k,#888) 16%,transparent);color:var(--k,#888)}
.demo{--k:#e8890c}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
label{display:block;font-weight:600;margin:12px 0 4px}.form{max-width:680px}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:24px;text-align:center;cursor:pointer;color:var(--m)}.drop.h{border-color:var(--b);background:#3478f60f}
.prev img{width:90px;height:90px;object-fit:cover;border-radius:10px;margin:8px 8px 0 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:12px 0 26px}.steps b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;margin-bottom:6px}
.pct{font-size:40px;font-weight:800;color:var(--g)}.ok{color:var(--g)}.no{color:#e5484d}
.bar{display:grid;grid-template-columns:120px 1fr 36px;gap:8px;align-items:center;margin:6px 0}.bar i{display:block;height:12px;border-radius:6px;background:var(--b)}
.pie{width:150px;height:150px;border-radius:50%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.tw{overflow-x:auto}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.nb{background:#e5484d;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:3px}
.un{background:#3478f61a}
</style></head><body>
<header><a class="logo" href="#home">FINDLY <b>AI</b></a><nav id="nav"></nav></header>
<main id="app"></main><div id="toast"></div>
<script>
const CATS=['Құжаттар','Смартфондар','Ноутбуктер','Кілттер','Сөмкелер','Киім','Әшекейлер','Басқа заттар'];
const ICO=['📄','📱','💻','🔑','🎒','👕','💍','📦'];
const COLS=['қара','ақ','көк','қызыл','жасыл','сары','сұр','күміс','қоңыр'];
const LOCS=['Бас корпус','Кітапхана','Асхана','Спорт кешені','Жатақхана','Аула'];
const ST={active:['Белсенді','g'],found:['Табылды','b'],returned:['Қайтарылды','p'],closed:['Жабық','x']};
const PL={cat:'Санат сәйкес',col:'Түсі сәйкес',name:'Атау ұқсастығы',desc:'Сипаттама ұқсастығы',loc:'Орны сәйкес',tm:'Уақыт аралығы сәйкес'};
const LB={cat:'санаты',col:'түсі',name:'атауы',desc:'сипаттамасы',loc:'орналасқан орны',tm:'уақыт аралығы'};
let mem=null;
function load(){try{const s=localStorage.getItem('findly1');if(s)return JSON.parse(s)}catch(e){}return mem||{u:[],lost:[],found:[],m:[],cl:[],h:[],n:[],cur:null,seq:1}}
let db=load();
function save(){mem=db;try{localStorage.setItem('findly1',JSON.stringify(db))}catch(e){toast('Жад толы: фото сақталмауы мүмкін')}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid=()=>db.seq++,me=()=>db.u.find(u=>u.id==db.cur),uname=i=>(db.u.find(u=>u.id==i)||{}).name||'—',fd=d=>(d||'').replace('T',' ');
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2600)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const notify=(uid,text,link)=>{db.n.push({id:nid(),uid,text,link,read:0,t:Date.now()})};
const hist=(type,rid,from,to)=>{db.h.push({id:nid(),type,rid,from,to,by:db.cur,t:Date.now()})};
function setSt(type,it,s){if(it.status==s)return;hist(type,it.id,it.status,s);it.status=s;if(it.uid!=db.cur)notify(it.uid,`«${it.name}» хабарламасының статусы өзгерді: ${ST[s][0]}`,'#item/'+type+'/'+it.id)}
/* ---- AI matching: weighted similarity ---- */
const SY={'телеф':'ph','смарт':'ph','ұялы':'ph','phone':'ph','мобил':'ph','mobil':'ph','ноутб':'lp','lapto':'lp','кілт':'ky','сөмке':'bg'};
const STOP=['және','бар','түсті'];
const tok=s=>new Set(((s||'').toLowerCase().match(/[a-zа-яәіңғүұқөһё0-9]+/g)||[]).filter(w=>w.length>1&&!STOP.includes(w)).map(w=>{w=w.slice(0,5);return SY[w]||w}));
function dice(a,b){const A=tok(a),B=tok(b);if(!A.size||!B.size)return 0;let i=0;A.forEach(x=>B.has(x)&&i++);return 2*i/(A.size+B.size)}
function score(l,f){const dd=(new Date(f.dt)-new Date(l.dt))/864e5;
 const p={cat:l.cat==f.cat?1:0,col:l.color==f.color?1:0,name:dice(l.name,f.name),desc:dice(l.desc+' '+l.feat,f.desc+' '+f.feat),loc:l.loc==f.loc?1:0,tm:dd<-1?0:dd<=1?1:dd<=3?.7:dd<=7?.4:0};
 const w={cat:20,col:15,name:25,desc:15,loc:15,tm:10};return{total:Math.round(Object.keys(w).reduce((s,k)=>s+w[k]*p[k],0)),p}}
const lvl=s=>s>=85?['Жоғары сәйкестік','g']:s>=60?['Орташа сәйкестік','b']:['Төмен сәйкестік','x'];
function expl(p,s){const ok=Object.keys(p).filter(k=>p[k]>=.5).map(k=>LB[k]);return ok.length?`Бұл табылған зат сіздің жоғалған затыңызға сәйкес келу ықтималдығы ${lvl(s)[0].split(' ')[0].toLowerCase()}, себебі оның ${ok.join(', ')} ұқсас.`:'Сәйкестік белгілері әлсіз.'}
function runMatch(type,it){(type=='lost'?db.found:db.lost).filter(o=>o.status=='active').forEach(o=>{const l=type=='lost'?it:o,f=type=='lost'?o:it;if(db.m.some(m=>m.l==l.id&&m.f==f.id))return;const r=score(l,f);if(r.total<50||!r.p.cat)return;
 db.m.push({id:nid(),l:l.id,f:f.id,s:r.total,p:r.p,ex:expl(r.p,r.total),t:Date.now()});const tx=`Ықтимал сәйкестік табылды: «${l.name}» ↔ «${f.name}» (${r.total}%)`;notify(l.uid,tx,'#match');if(f.uid!=l.uid)notify(f.uid,tx,'#match')})}
const L=m=>db.lost.find(x=>x.id==m.l),Fo=m=>db.found.find(x=>x.id==m.f),vm=()=>db.m.filter(m=>L(m)&&Fo(m));
/* ---- auth ---- */
async function doReg(){const n=$('#rn').value.trim(),e=$('#re').value.trim().toLowerCase(),p=$('#rp').value;if(!n||!/\S+@\S+\.\S+/.test(e)||p.length<6)return toast('Деректерді дұрыс толтырыңыз (құпиясөз ≥ 6 таңба)');if(db.u.some(u=>u.email==e))return toast('Бұл email тіркелген');
 const u={id:nid(),name:n,email:e,pw:await sha(p),role:'user',t:Date.now()};db.u.push(u);db.cur=u.id;save();toast('Тіркелу сәтті аяқталды');location.hash='#home';render()}
async function doLogin(){const e=$('#le').value.trim().toLowerCase(),u=db.u.find(x=>x.email==e);if(!u||u.pw!=await sha($('#lp').value))return toast('Email немесе құпиясөз қате');if(u.blocked)return toast('Аккаунт бұғатталған');db.cur=u.id;save();toast('Қош келдіңіз!');location.hash='#home';render()}
function logout(){db.cur=null;save();location.hash='#home';render()}
/* ---- reports ---- */
let PH=[];
function addFiles(fs){[...fs].slice(0,3-PH.length).forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,360/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PH.push(c.toDataURL('image/jpeg',.7));prev()};im.src=r.result};r.readAsDataURL(f)})}
const prev=()=>{const e=$('#prev');if(e)e.innerHTML=PH.map(p=>`<img src="${p}" alt="">`).join('')};
function publish(){const g=i=>$('#'+i).value.trim(),t=document.querySelector('input[name=tp]:checked').value;
 const d={name:g('f_name'),cat:g('f_cat'),desc:g('f_desc'),color:g('f_col'),feat:g('f_feat'),loc:g('f_loc'),dt:g('f_dt'),contact:g('f_ct')};
 if(!d.name||!d.desc||!d.loc||!d.dt||!d.contact)return toast('Міндетті өрістерді толтырыңыз');
 const it={...d,id:nid(),uid:db.cur,ph:PH.slice(),status:'active',t:Date.now()};(t=='lost'?db.lost:db.found).push(it);hist(t,it.id,'—','active');runMatch(t,it);save();PH=[];toast('Хабарлама сәтті жарияланды');location.hash='#item/'+t+'/'+it.id}
function delIt(t,id){if(!confirm('Хабарламаны жою керек пе?'))return;const a=t=='lost'?db.lost:db.found;db[t]=a.filter(x=>x.id!=id);db.m=db.m.filter(m=>t=='lost'?m.l!=id:m.f!=id);save();toast('Жойылды');location.hash='#profile'}
function editIt(t,id){const it=(t=='lost'?db.lost:db.found).find(x=>x.id==id),n=prompt('Атауы',it.name);if(!n)return;const d=prompt('Сипаттамасы',it.desc);if(!d)return;it.name=n;it.desc=d;save();toast('Сақталды');render()}
function stat(t,id,s){setSt(t,(t=='lost'?db.lost:db.found).find(x=>x.id==id),s);save();toast('Статус жаңартылды');render()}
/* ---- claims ---- */
function claim(mid){const p=prompt('Меншік иесі екеніңізді растайтын ерекшелікті жазыңыз');if(!p)return;const m=db.m.find(x=>x.id==mid);db.cl.push({id:nid(),m:mid,by:db.cur,proof:p,st:'pending',conf:{l:0,f:0},t:Date.now()});notify(Fo(m).uid,`«${Fo(m).name}» затына меншік құқығына өтінім түсті`,'#match');save();toast('Өтінім жіберілді');render()}
function decide(cid,ok){const c=db.cl.find(x=>x.id==cid),m=db.m.find(x=>x.id==c.m);c.st=ok?'approved':'rejected';notify(c.by,ok?'Өтініміңіз қабылданды. Байланыс деректері ашылды':'Өтініміңіз қабылданбады','#match');if(ok){setSt('lost',L(m),'found');setSt('found',Fo(m),'found')}save();render()}
function conf(cid){const c=db.cl.find(x=>x.id==cid),m=db.m.find(x=>x.id==c.m);c.conf[me().id==L(m).uid?'l':'f']=1;
 if(c.conf.l&&c.conf.f){c.st='done';setSt('lost',L(m),'returned');setSt('found',Fo(m),'returned');notify(L(m).uid,'Затыңыз қайтарылды','#item/lost/'+m.l);notify(Fo(m).uid,'Зат иесіне қайтарылды','#item/found/'+m.f)}save();toast('Расталды');render()}
function seeContact(t,it){const u=me();if(!u)return false;if(u.role=='admin'||u.id==it.uid)return true;
 return db.cl.some(c=>['approved','done'].includes(c.st)&&(m=>m&&L(m)&&Fo(m)&&(t=='lost'?m.l==it.id:m.f==it.id)&&(u.id==L(m).uid||u.id==Fo(m).uid))(db.m.find(x=>x.id==c.m)))}
/* ---- views ---- */
const badge=s=>`<span class="badge ${ST[s][1]}">${ST[s][0]}</span>`;
const dm=it=>it.demo?'<span class="badge demo">ДЕМО</span>':'';
function card(it,t){const i=CATS.indexOf(it.cat);return`<div class="card item" onclick="location.hash='#item/${t}/${it.id}'"><div class="im">${it.ph&&it.ph[0]?`<img src="${it.ph[0]}" alt="">`:ICO[i]||'📦'}</div><div class="bd">${badge(it.status)}<span class="badge ${t=='lost'?'x':'g'}">${t=='lost'?'Жоғалды':'Табылды'}</span>${dm(it)}<h3 style="margin:4px 0">${esc(it.name)}</h3><small>${esc(it.cat)} · ${esc(it.color)}</small><p class="mut" style="margin:6px 0">${esc(it.desc.slice(0,70))}</p><small>📍 ${esc(it.loc)}<br>🕒 ${fd(it.dt)}<br>👤 ${esc(uname(it.uid))}</small></div></div>`}
const need=()=>`<div class="card"><h2>Кіру қажет</h2><p>Бұл бөлімді көру үшін жүйеге кіріңіз.</p><a class="btn" href="#auth">Кіру / Тіркелу</a></div>`;
let FL={q:'',cat:'',st:'',col:'',loc:'',d:'',sort:'new'},LT='lost';
function res(){const a=(LT=='lost'?db.lost:db.found).filter(x=>(!FL.q||[x.name,x.cat,x.color,x.loc,x.desc].join(' ').toLowerCase().includes(FL.q.toLowerCase()))&&(!FL.cat||x.cat==FL.cat)&&(!FL.st||x.status==FL.st)&&(!FL.col||x.color==FL.col)&&(!FL.loc||x.loc==FL.loc)&&(!FL.d||x.dt.startsWith(FL.d)));
 a.sort((x,y)=>FL.sort=='new'?y.t-x.t:x.t-y.t);const e=$('#res');if(e)e.innerHTML=a.length?a.map(x=>card(x,LT)).join(''):'<p class="mut">Ештеңе табылмады</p>'}
const opts=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function listPage(t){LT=t;setTimeout(res);return`<h1>${t=='lost'?'Жоғалған заттар':'Табылған заттар'}</h1><div class="card" style="margin-bottom:16px"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
<input placeholder="Іздеу…" value="${esc(FL.q)}" oninput="FL.q=this.value;res()"><select onchange="FL.cat=this.value;res()">${opts(CATS,FL.cat,'Барлық санат')}</select><select onchange="FL.col=this.value;res()">${opts(COLS,FL.col,'Барлық түс')}</select><select onchange="FL.loc=this.value;res()">${opts(LOCS,FL.loc,'Барлық орын')}</select>
<select onchange="FL.st=this.value;res()"><option value="">Барлық статус</option>${Object.keys(ST).map(k=>`<option value="${k}" ${FL.st==k?'selected':''}>${ST[k][0]}</option>`).join('')}</select><input type="date" value="${FL.d}" onchange="FL.d=this.value;res()"><select onchange="FL.sort=this.value;res()"><option value="new">Жаңалары алдымен</option><option value="old" ${FL.sort=='old'?'selected':''}>Ескілері алдымен</option></select><button class="btn o" onclick="FL={q:'',cat:'',st:'',col:'',loc:'',d:'',sort:'new'};render()">Тазалау</button></div></div><div class="grid" id="res"></div>`}
const V={
home(){const all=[...db.lost.map(x=>[x,'lost']),...db.found.map(x=>[x,'found'])],ret=all.filter(a=>a[0].status=='returned').length;
 return`<section class="hero"><h1>Жоғалған затыңызды бірге табайық!</h1><p>FINDLY AI — жасанды интеллект арқылы жоғалған және табылған заттарды автоматты түрде сәйкестендіретін ақылды платформа.</p><p><i>Маңыздыны тап. AI көмегімен тезірек.</i></p><div class="row"><a class="btn big" href="#new/lost">Мен зат жоғалттым</a><a class="btn big g" href="#new/found">Мен зат таптым</a></div></section>
<div class="grid4">${[['Барлық хабарламалар',all.length],['Жоғалған заттар',db.lost.length],['Табылған заттар',db.found.length],['Сәтті қайтарылғандар',ret]].map(s=>`<div class="card"><small>${s[0]}</small><b class="num">${s[1]}</b></div>`).join('')}</div>
